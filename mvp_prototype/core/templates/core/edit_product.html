{% extends 'core/base.html' %}
{% block title %}Редактирование товара{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2 class="fw-bold mb-1">Редактирование товара</h2>
        <a href="{% url 'seller_products' %}" class="text-decoration-none text-muted small">← Вернуться к списку
            товаров</a>
    </div>
</div>

<div class="card border-0 shadow-sm rounded-3">
    <div class="card-body p-4 p-md-5">
        <form method="post">
            {% csrf_token %}

            <div class="row g-4">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Название книги</label>
                    <input type="text" name="title" class="form-control rounded-3" value="{{ product.title }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Автор</label>
                    <input type="text" name="author" class="form-control rounded-3" value="{{ product.author }}"
                        required>
                </div>
            </div>

            <div class="row g-4 mt-1">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Цена (₽)</label>
                    <input type="number" name="price" class="form-control rounded-3" value="{{ product.price }}"
                        required step="0.01">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Остаток на складе</label>
                    <input type="number" name="stock_quantity" class="form-control rounded-3"
                        value="{{ product.stock_quantity }}" min="0">
                    <div class="form-text small text-muted">Корректировка физических остатков (синхронизация с WMS)
                    </div>
                </div>
            </div>

            <div class="mt-4">
                <label class="form-label fw-semibold">Категория</label>
                <select name="category" class="form-select rounded-3" required>
                    {% for cat in categories %}
                    <option value="{{ cat.id }}" {% if cat.is_selected %}selected{% endif %}>
                        {{ cat.name }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="mt-4">
                <label class="form-label fw-semibold">Ссылка на обложку (URL)</label>
                <input type="text" name="image_url" class="form-control rounded-3" value="{{ product.image_url }}">
            </div>

            <div class="mt-4">
                <label class="form-label fw-semibold">Описание</label>
                <textarea name="description" class="form-control rounded-3"
                    rows="4">{{ product.description }}</textarea>
            </div>

            <div class="d-flex justify-content-end gap-3 mt-5 pt-3 border-top">
                <a href="{% url 'seller_products' %}" class="btn btn-outline-dark rounded-3 px-4">Отмена</a>
                <button type="submit" class="btn btn-dark rounded-3 px-4">💾 Сохранить изменения</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
