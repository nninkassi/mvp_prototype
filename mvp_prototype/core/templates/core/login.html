{% extends 'core/base.html' %}

{% block title %}Вход в систему{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">

            <!-- Логотип/Заголовок -->
            <div class="text-center mb-4">
                <h1 class="h3 fw-bold text-dark mb-2">Вход</h1>
            </div>

            <!-- Карточка входа -->
            <div class="card border-0 shadow-sm rounded-3">
                <div class="card-body p-4 p-md-5">

                    <!-- Сообщения об ошибках -->
                    {% if error %}
                    <div class="alert alert-danger alert-dismissible fade show mb-4 rounded-3" role="alert">
                        ⚠️ {{ error }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                    {% endif %}

                    <!-- Форма входа -->
                    <form method="post">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label for="email" class="form-label text-muted small">Email</label>
                            <input type="email" class="form-control form-control-lg rounded-3" id="email" name="email"
                                required placeholder="you@example.ru" value="{{ request.POST.email|default:'' }}">
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label text-muted small">Пароль</label>
                            <input type="password" class="form-control form-control-lg rounded-3" id="password"
                                name="password" required>
                        </div>

                        <button type="submit" class="btn btn-dark btn-lg w-100 rounded-3 fw-medium mb-3">
                            Войти
                        </button>
                    </form>

                    <!-- Разделитель -->
                    <div class="text-center mb-3">
                        <hr class="text-muted opacity-25">
                    </div>

                    <!-- Ссылка на регистрацию -->
                    <div class="text-center">
                        <p class="text-muted mb-0">
                            Ещё нет аккаунта?
                            <a href="{% url 'register' %}" class="text-decoration-none fw-medium">Зарегистрироваться</a>
                        </p>
                    </div>

                </div>
            </div>

            <!-- Дополнительная информация -->
            <div class="text-center mt-4">
                <p class="text-muted small mb-0">
                    <a href="{% url 'policy' %}" class="text-decoration-none text-muted">Политика конфиденциальности</a>
                </p>
            </div>

        </div>
    </div>
</div>
{% endblock %}
