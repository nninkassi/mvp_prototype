{% extends 'core/base.html' %}
{% block title %}Добавить товар{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header bg-dark text-white">
                <h4 class="mb-0">Новый товар</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">Название книги</label>
                        <input type="text" name="title" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Автор</label>
                        <input type="text" name="author" class="form-control" required>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Цена (₽)</label>
                            <input type="number" name="price" class="form-control" required step="0.01">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Категория</label>
                            <select name="category" class="form-select" required>
                                {% for cat in categories %}
                                <option value="{{ cat.id }}">{{ cat.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Ссылка на обложку</label>
                        <input type="text" name="image_url" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Описание</label>
                        <textarea name="description" class="form-control" rows="3"></textarea>
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="{% url 'seller_stats' %}" class="btn btn-outline-secondary">Отмена</a>
                        <button type="submit" class="btn btn-dark">Опубликовать товар</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
